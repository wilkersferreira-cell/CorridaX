<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,
body,
#map{

margin:0;
padding:0;

width:100%;
height:100%;

}

</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map=L.map('map').setView([-3.119,-60.021],13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(map);

let markers=[];
let polyline=null;

function clearMap(){

markers.forEach(m=>map.removeLayer(m));

markers=[];

if(polyline){

map.removeLayer(polyline);

polyline=null;

}

}

document.addEventListener(
'message',
function(event){

clearMap();

const data=JSON.parse(event.data);

const bounds=[];

function addMarker(point,title){

if(!point) return;

const marker=L.marker([
point.latitude,
point.longitude
])
.addTo(map)
.bindPopup(title);

markers.push(marker);

bounds.push([
point.latitude,
point.longitude
]);

}

addMarker(
data.userLocation,
'Você'
);

addMarker(
data.origin,
'Origem'
);

addMarker(
data.destination,
'Destino'
);

if(
data.route &&
data.route.length>1
){

const points=data.route.map(
p=>[
p.latitude,
p.longitude
]
);

polyline=L.polyline(
points,
{
color:'#1976D2',
weight:5
}
).addTo(map);

points.forEach(p=>bounds.push(p));

}

if(bounds.length){

map.fitBounds(
bounds,
{
padding:[30,30]
}
);

}

});

</script>

</body>

</html>
