<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CorridaX</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #08111f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      max-width: 760px;
      text-align: center;
    }
    h1 {
      font-size: 52px;
      margin-bottom: 8px;
    }
    .x { color: #21d07a; }
    p {
      color: #b8c2d1;
      font-size: 18px;
      line-height: 1.6;
    }
    .links {
      margin-top: 36px;
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a {
      text-decoration: none;
      background: #ffffff;
      color: #08111f;
      padding: 14px 22px;
      border-radius: 10px;
      font-weight: bold;
    }
    a:hover {
      background: #21d07a;
    }
    footer {
      margin-top: 48px;
      color: #758196;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Corrida<span class="x">X</span></h1>
    <p>
      Uma plataforma independente de mobilidade criada para ajudar usuários
      a planejar seus deslocamentos e tomar decisões de forma simples,
      prática e informada.
    </p>

    <div class="links">
      <a href="/privacidade">Política de Privacidade</a>
      <a href="/termos">Termos de Uso</a>
    </div>

    <footer>
      © 2026 CorridaX
    </footer>
  </main>
</body>
</html>
